  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">

  <!-- Runs before first paint: saved theme, motion preference, and the "ready" flag that starts the intro once fonts load -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var saved = localStorage.getItem('pr-theme');
        if (saved === 'light' || saved === 'dark') d.setAttribute('data-theme', saved);
      } catch (e) {}
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce && !navigator.webdriver) d.classList.add('motion');
      var fired = false;
      function ready() {
        if (fired) return;
        fired = true;
        window.prReadyAt = performance.now();
        d.classList.add('ready');
        document.dispatchEvent(new Event('pr:ready'));
      }
      try {
        if (document.fonts && document.fonts.load) {
          Promise.all([
            document.fonts.load('780 64px "Archivo"'),
            document.fonts.load('700 64px "JetBrains Mono"'),
            document.fonts.load('400 16px "Instrument Sans"')
          ]).then(ready, ready);
        }
      } catch (e) {}
      setTimeout(ready, 1100);
    })();
  </script>
  <title>Priyank Raychura | Full-stack developer</title>
</head>

<body>
  <div id="root"></div>
